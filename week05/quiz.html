<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz form</title>
    <meta name="description" content="A simple quiz form example for week 5.">
    <meta name="author" description="Wilfrank Infante">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Quiz form example</h1>
        <form action="#">
            <fieldset>
                <legend>Input Fields</legend>
                <label for="q1"><span class="numbers">1.</span> What does the acronym css stand
                    for?</label>
                <input type="text" id="q1" name="q1" required>

                <label for="q2"><span class="numbers">2.</span> How are id and class attributes
                    selected in css?</label>
                <textarea name="q2" id="q2" rows="5" required></textarea>

                <label for="q3"><span class="numbers">3.</span> Which of the following is a valid
                    CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="0">Choose one ...</option>
                    <option value="1">/* this is a comment */</option>
                    <option value="2">// This is a comment</option>
                    <option value="3"># This is a comment</option>
                    <option value="4">&lt;!-- This is a comment --&gt;</option>
                </select>

                <label for="q4"><span class="numbers">4.</span> What is the bottom margin given this
                    declaration?</label>
                <p class="code">margin: 10px 5px 15px;</p>
                <input type="text" name="q4" id="q4" required>
            </fieldset>

            <button type="submit">Submit quiz</button>
        </form>


    </main>
</body>

</html>
